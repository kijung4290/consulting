<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - AI 상담 일지 생성기</title>
  <link rel="stylesheet" href="/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="shell" style="max-width: 400px; margin: 80px auto; padding: 30px;">
    <div class="card">
      <h2 style="text-align: center; margin-bottom: 20px;">서비스 로그인</h2>
      <p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 0.9rem;">
        승인된 사용자만 접근할 수 있습니다.
      </p>
      <div style="display: flex; flex-direction: column; gap: 15px;">
        <button type="button" class="btn-primary" id="googleLoginBtn" style="background-color: #4285F4;">
          구글 계정으로 로그인 (Google)
        </button>
      </div>
      <div id="authStatus" style="margin-top: 15px; color: #e11d48; text-align: center; font-weight: 500; font-size: 0.9rem;"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/auth.js"></script>
</body>
</html>
